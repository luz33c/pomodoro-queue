name: universal-todo2027-db-dev

services:
  postgres:
    image: postgres:18-alpine
    container_name: universal-todo2027-db-dev-postgres
    environment:
      POSTGRES_DB: universal-todo2027
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: changeme
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - universal-todo2027-db-dev-postgres-dev:/var/lib/postgresql

volumes:
  universal-todo2027-db-dev-postgres-dev:
